<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groundwork</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #17221a;
        font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f2eedf;
      }
      #map {
        position: fixed;
        inset: 0;
      }
      #map canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 6px 12px;
        background: rgba(20, 24, 20, 0.85);
        border-bottom: 1px solid #3b4a3b;
        user-select: none;
      }
      #hud .field {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      #hud .label {
        color: #a7b39b;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #hud button {
        font: inherit;
        color: inherit;
        background: #2d3a2d;
        border: 1px solid #56684f;
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
      }
      #hud button[aria-pressed="true"] {
        background: #c9a227;
        border-color: #f0cf5a;
        color: #1b1b12;
      }
      #hud-message {
        margin-left: auto;
        color: #d8d2b8;
      }
      #hud-conn[data-status="closed"] {
        color: #ff8a7a;
      }
      #help {
        position: fixed;
        bottom: 8px;
        left: 12px;
        color: #c7cdb8;
        font-size: 12px;
        background: rgba(20, 24, 20, 0.7);
        padding: 4px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">
      <div class="field"><span class="label">Date</span><span id="hud-date">...</span></div>
      <div class="field"><span class="label">Clock</span><span id="hud-speed">...</span></div>
      <div class="field">
        <button type="button" data-speed="1" aria-pressed="false">1x</button>
        <button type="button" data-speed="2" aria-pressed="false">2x</button>
        <button type="button" data-speed="4" aria-pressed="false">4x</button>
      </div>
      <div class="field"><span class="label">Cash</span><span id="hud-cash">...</span></div>
      <button type="button" id="tool-road" aria-pressed="false">Road (R)</button>
      <span id="hud-message"></span>
      <span id="hud-conn" data-status="connecting">connecting</span>
    </div>
    <div id="help">Drag or arrow keys to pan. Wheel or +/- to zoom. Home to find your land. R for road, Esc to stop.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
